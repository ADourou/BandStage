<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="formStyle.css">
    <title>My Profile</title>
    
    <style>
        .profile-container {
            padding: 20px;
            color: aliceblue;
        }
        
        input:disabled {
            background-color: rgba(255, 255, 255, 0.1);
            color: #aaa;
            border-color: #555;
            cursor: not-allowed;
        }

        .msg-box {
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
            display: none;
        }
    </style>
</head>

<body>
    <div class="form">
        <header>
            <img src="assets/logo.png" alt="BandStage logo" style="width: 60px; margin-right:0px;">
            <img src="assets/bandstage.png" alt="BandStage text logo" style="width: 100px; margin-left:-10px;">
            
            <h2 class="header-title" id="pageTitle">Login</h2>
            
            <div class="role-segment" style="visibility: hidden;"></div> 
        </header>

        <main>
            <div id="loginSection">
                <form id="loginForm" onsubmit="event.preventDefault(); login();">
                    
                    <div class="row-fields">
                        <div class="field">
                            <label for="loginUsername">Username</label>
                            <input id="loginUsername" type="text" placeholder="Enter your username" required>
                        </div>

                        <div class="field">
                            <label for="loginPassword">Password</label>
                            <div class="password-wrapper">
                                <input id="loginPassword" type="password" placeholder="Enter your password" required>
                            </div>
                        </div>
                    </div>

                    <div id="loginMessage" class="msg-box" style="color: red;"></div>

                    <div class="actions">
                        <button type="submit" class="btn-submit">Login</button>
                    </div>
                </form>
            </div>


            <div id="profileSection" style="display: none;">
                
                <form id="profileForm" onsubmit="event.preventDefault(); updateProfile();">
                    <div class="profile-container">
                        <h4 style="text-align: center; color: #02becf; margin-bottom: 20px;">Your Details</h4>
                        
                        <div id="profileFields" class="row-fields">
                            </div>

                        <div id="profileMessage" class="msg-box"></div>
                    </div>

                    <div class="actions" style="gap: 20px;">
                        <button type="submit" class="btn-submit" style="background-color: #02becf;">Update Info</button>
                        
                        <button type="button" class="btn-submit" onclick="logout()" style="background-color: #ff4444; color: white;">Logout</button>
                    </div>
                </form>
            </div>

        </main>
    </div>

    <script src="profile.js"></script>
</body>
</html>
